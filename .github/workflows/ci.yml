name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: GCC Debug + Sanitizers
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Debug
            cmake_extra: -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
            linker_flags: -fsanitize=address,undefined

          - name: GCC Release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            cmake_extra: ""
            linker_flags: ""

          - name: Clang Debug + Sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            cmake_extra: -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
            linker_flags: -fsanitize=address,undefined

          - name: Clang Release
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release
            cmake_extra: ""
            linker_flags: ""

          - name: MSVC Release
            os: windows-latest
            cc: cl
            cxx: cl
            build_type: Release
            cmake_extra: ""
            linker_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache apt packages (Linux only)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ matrix.config.name }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/*.cpp', '**/*.hh') }}
          restore-keys: |
            build-${{ matrix.config.name }}-${{ runner.os }}-

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: |
          cmake --fresh -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.config.linker_flags }}" \
            ${{ matrix.config.cmake_extra }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --fresh -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}

      - name: Build
        run: cmake --fresh --build build --parallel --config ${{ matrix.config.build_type }}

      - name: Run tests
        run: ctest --fresh --test-dir build --output-on-failure --build-config ${{ matrix.config.build_type }}