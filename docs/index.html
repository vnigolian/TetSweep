<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TetWeave — Mesh Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #0f0f0f;
      flex-shrink: 0;
    }

    header h1 { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: 0.05em; }
    header span { font-size: 12px; color: #555; }

    .main { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 340px;
      flex-shrink: 0;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #111;
    }

    .sidebar-section { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; }

    .sidebar-section label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      /* ========================================================
         COMMAND TEXT COLOR — change this to tweak the args color
         ======================================================== */
      color: #b0e0b0;
      font-family: inherit;
      font-size: 12px;
      padding: 10px;
      resize: vertical;
      min-height: 80px;
      outline: none;
      line-height: 1.6;
    }

    textarea:focus { border-color: #444; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .checkbox-row input[type=checkbox] { accent-color: #6dbb6d; cursor: pointer; }
    .checkbox-row span { font-size: 11px; color: #666; cursor: pointer; user-select: none; }

    .examples { display: flex; flex-direction: column; gap: 4px; }

    .example-btn {
      background: none;
      border: 1px solid #222;
      border-radius: 4px;
      color: #666;
      font-family: inherit;
      font-size: 11px;
      padding: 6px 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .example-btn:hover { border-color: #444; color: #999; background: #181818; }

    .generate-btn {
      margin: 14px 16px;
      width: calc(100% - 32px);
      background: #1a2a1a;
      border: 1px solid #2a4a2a;
      border-radius: 4px;
      color: #6dbb6d;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.1s;
      flex-shrink: 0;
    }

    .generate-btn:hover { background: #223022; border-color: #3a6a3a; }
    .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status { padding: 0 16px 10px; font-size: 11px; color: #555; min-height: 20px; flex-shrink: 0; }
    .status.error { color: #c04040; }
    .status.ok    { color: #4a8a4a; }

    .stats { padding: 10px 16px; border-top: 1px solid #1a1a1a; display: flex; gap: 16px; flex-shrink: 0; }
    .stat { font-size: 11px; color: #444; }
    .stat span { color: #777; }

    .controls { padding: 10px 16px; border-top: 1px solid #1a1a1a; display: flex; gap: 8px; flex-shrink: 0; }

    .toggle-btn {
      flex: 1;
      background: none;
      border: 1px solid #222;
      border-radius: 4px;
      color: #555;
      font-family: inherit;
      font-size: 11px;
      padding: 6px;
      cursor: pointer;
      transition: all 0.1s;
    }

    .toggle-btn.active { border-color: #2a4a2a; color: #6dbb6d; background: #1a2a1a; }
    .toggle-btn:hover:not(.active) { border-color: #333; color: #777; }

    .download-btn {
      flex: 1;
      background: none;
      border: 1px solid #222;
      border-radius: 4px;
      color: #555;
      font-family: inherit;
      font-size: 11px;
      padding: 6px;
      cursor: pointer;
      transition: all 0.1s;
    }

    .download-btn:hover:not(:disabled) { border-color: #333; color: #777; }
    .download-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .viewport { flex: 1; position: relative; background: #0a0a0a; overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #333;
      letter-spacing: 0.1em;
    }

    .hint { position: absolute; bottom: 16px; right: 16px; font-size: 10px; color: #2a2a2a; letter-spacing: 0.05em; pointer-events: none; }
  </style>
</head>
<body>

<header>
  <h1>TetWeave</h1>
  <span>tetrahedral mesh generator</span>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-section">
      <label>command</label>
      <textarea id="args-input" rows="4" spellcheck="false">--mesh-type rod --length 10 --output mesh.obj</textarea>
      <div class="checkbox-row">
        <input type="checkbox" id="boundary-only-cb" checked>
        <span onclick="document.getElementById('boundary-only-cb').click()">--boundary-only</span>
      </div>
    </div>

    <div class="sidebar-section">
      <label>examples</label>
      <div class="examples">
        <button class="example-btn" data-args="--mesh-type knotted-hole --knotted-hole-segments 5 --output mesh.obj">knotted-hole</button>
        <button class="example-btn" data-args="--mesh-type spiral --length 60 --torsion-rad 6.2831853 --spiral-x-scale 10.0 --spiral-turn-count 5.0 --output mesh.obj">spiral</button>
        <button class="example-btn" data-args="--mesh-type para-trefoil-knot --para-args 0 --para-t 0.0 0.95 --length 100 --para-thickness 0.4 --output mesh.obj">para-trefoil-knot</button>
        <button class="example-btn" data-args="--mesh-type para-torus --para-args 3.0 1.0 --para-u 0.0 4.0 --para-v 0.0 4.0 --width 20 --height 20 --para-thickness 0.2 --output mesh.obj">para-torus</button>
      </div>
    </div>

    <button class="generate-btn" id="generate-btn" disabled>loading wasm...</button>
    <div class="status" id="status"></div>

    <div class="controls">
      <button class="toggle-btn active" id="solid-btn">solid</button>
      <button class="toggle-btn active" id="wire-btn">wireframe</button>
      <button class="download-btn" id="download-btn" disabled>↓ download .obj</button>
    </div>

    <div class="stats">
      <div class="stat">vertices <span id="stat-verts">—</span></div>
      <div class="stat">faces <span id="stat-faces">—</span></div>
    </div>
  </div>

  <div class="viewport">
    <canvas id="canvas"></canvas>
    <div class="loading-overlay" id="loading">initialising</div>
    <div class="hint">drag to rotate · scroll to zoom</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const canvas     = document.getElementById('canvas');
  const statusEl   = document.getElementById('status');
  const genBtn     = document.getElementById('generate-btn');
  const solidBtn   = document.getElementById('solid-btn');
  const wireBtn    = document.getElementById('wire-btn');
  const dlBtn      = document.getElementById('download-btn');
  const loading    = document.getElementById('loading');
  const argsInput  = document.getElementById('args-input');
  const boundaryCb = document.getElementById('boundary-only-cb');

  let wasmModule = null;
  let currentObj = null;
  let solidMesh  = null;
  let wireMesh   = null;
  let showSolid  = true;
  let showWire   = true;

  // ============================================================
  // MESH COLORS — change these to tweak the appearance
  const SOLID_COLOR    = 0x116611;  // near-white surface
  const SOLID_SPECULAR = 0x111111;  // specular highlight
  const WIRE_COLOR     = 0xffffff;  // wireframe
  // ============================================================

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x1a1a1a);
  //0x0a0a0a

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
  camera.position.set(0, 0, 5);

  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(1, 2, 3);
  scene.add(dirLight);

  let isDragging = false, prevX = 0, prevY = 0;
  const pivot = new THREE.Group();
  scene.add(pivot);

  canvas.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
  window.addEventListener('mouseup',   () => isDragging = false);
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    pivot.rotation.y += (e.clientX - prevX) * 0.01;
    pivot.rotation.x += (e.clientY - prevY) * 0.01;
    prevX = e.clientX; prevY = e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    camera.position.z = Math.max(0.5, Math.min(50, camera.position.z + e.deltaY * 0.01));
  });

  function resize() {
    const w = canvas.parentElement.clientWidth;
    const h = canvas.parentElement.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
  animate();

  function parseObj(objStr) {
    const positions = [];
    const indices   = [];
    for (const line of objStr.split('\n')) {
      if (line.startsWith('v ')) {
        const p = line.trim().split(/\s+/);
        positions.push(parseFloat(p[1]), parseFloat(p[2]), parseFloat(p[3]));
      } else if (line.startsWith('f ')) {
        const p = line.trim().split(/\s+/);
        indices.push(parseInt(p[1]) - 1, parseInt(p[2]) - 1, parseInt(p[3]) - 1);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return { geo, nVerts: positions.length / 3, nFaces: indices.length / 3 };
  }

  function clearScene() {
    if (solidMesh) { pivot.remove(solidMesh); solidMesh.geometry.dispose(); solidMesh = null; }
    if (wireMesh)  { pivot.remove(wireMesh);  wireMesh.geometry.dispose();  wireMesh  = null; }
  }

  function displayMesh(objStr) {
    clearScene();
    const { geo, nVerts, nFaces } = parseObj(objStr);

    geo.computeBoundingBox();
    const center = new THREE.Vector3();
    geo.boundingBox.getCenter(center);
    geo.translate(-center.x, -center.y, -center.z);

    const size = new THREE.Vector3();
    geo.boundingBox.getSize(size);
    const scale = 2.5 / Math.max(size.x, size.y, size.z);
    geo.scale(scale, scale, scale);

    solidMesh = new THREE.Mesh(geo,
            new THREE.MeshPhongMaterial({ color: SOLID_COLOR, specular: SOLID_SPECULAR, shininess: 40, side: THREE.DoubleSide }));
    wireMesh  = new THREE.Mesh(geo,
            new THREE.MeshBasicMaterial({ color: WIRE_COLOR, wireframe: true }));

    solidMesh.visible = showSolid;
    wireMesh.visible  = showWire;

    pivot.add(solidMesh, wireMesh);
    pivot.rotation.set(0.3, 0.5, 0);

    document.getElementById('stat-verts').textContent = nVerts.toLocaleString();
    document.getElementById('stat-faces').textContent = nFaces.toLocaleString();
  }

  solidBtn.addEventListener('click', () => {
    showSolid = !showSolid;
    solidBtn.classList.toggle('active', showSolid);
    if (solidMesh) solidMesh.visible = showSolid;
  });

  wireBtn.addEventListener('click', () => {
    showWire = !showWire;
    wireBtn.classList.toggle('active', showWire);
    if (wireMesh) wireMesh.visible = showWire;
  });

  // Rewrite --output and --boundary-only in the textarea when checkbox changes
  function updateArgs() {
    let args = argsInput.value
            .replace(/\s*--boundary-only\b/g, '')
            .replace(/--output\s+\S+/g, '')
            .trim();
    if (boundaryCb.checked) {
      args += ' --boundary-only --output boundary.obj';
    } else {
      args += ' --output mesh.obj';
    }
    argsInput.value = args.trim();
    dlBtn.textContent = boundaryCb.checked ? '↓ download boundary.obj' : '↓ download mesh.obj';
  }

  boundaryCb.addEventListener('change', updateArgs);

  document.querySelectorAll('.example-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      let args = btn.dataset.args;
      if (boundaryCb.checked) {
        args = args.replace(/--output\s+\S+/g, '').trim();
        args += ' --boundary-only --output boundary.obj';
      }
      argsInput.value = args;
    });
  });

  dlBtn.addEventListener('click', () => {
    if (!currentObj) return;
    const filename = boundaryCb.checked ? 'boundary.obj' : 'mesh.obj';
    const blob = new Blob([currentObj], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  });

  genBtn.addEventListener('click', () => {
    if (!wasmModule) return;
    const args = argsInput.value.trim();
    if (!args) { statusEl.textContent = 'enter arguments first'; statusEl.className = 'status error'; return; }

    genBtn.disabled = true;
    statusEl.textContent = 'generating...';
    statusEl.className = 'status';

    setTimeout(() => {
      try {
        const generate = wasmModule.cwrap('generate_mesh_str', 'number', ['string']);
        const ptr    = generate(args);
        const result = wasmModule.UTF8ToString(ptr);
        wasmModule._free_string(ptr);

        if (!result || result.length === 0) {
          statusEl.textContent = 'generation failed — check your arguments';
          statusEl.className = 'status error';
          genBtn.disabled = false;
          return;
        }

        currentObj = result;
        displayMesh(result);
        dlBtn.disabled = false;
        dlBtn.textContent = boundaryCb.checked ? '↓ download boundary.obj' : '↓ download mesh.obj';
        statusEl.textContent = 'ok';
        statusEl.className = 'status ok';
      } catch (e) {
        statusEl.textContent = 'error: ' + e.message;
        statusEl.className = 'status error';
      }
      genBtn.disabled = false;
    }, 0);
  });

  const script = document.createElement('script');
  script.src = 'tetweave_wasm.js';
  script.onload = () => {
    TetWeaveModule().then(mod => {
      wasmModule = mod;
      loading.style.display = 'none';
      genBtn.disabled = false;
      genBtn.textContent = 'generate';
      statusEl.textContent = 'ready';
      statusEl.className = 'status ok';

      // set the trefoil example and auto-generate
      argsInput.value = '--mesh-type para-trefoil-knot --para-args 0 --para-t 0.0 0.95 --length 100 --para-thickness 0.4 --boundary-only --output boundary.obj';
      genBtn.click();
    }).catch(e => {
      loading.textContent = 'failed to load wasm: ' + e.message;
    });
  };
  script.onerror = () => {
    loading.textContent = 'tetweave_wasm.js not found — run emmake make first';
  };
  document.head.appendChild(script);
</script>
</body>
</html>
